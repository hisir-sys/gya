name: Freeze gameplay checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  freeze-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check 3D game module syntax
        run: node --input-type=module --check < freeze.js
      - name: Check Phase 7–12 gameplay hooks
        run: node scripts/check-freeze-phases.mjs
