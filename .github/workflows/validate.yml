name: Validate prototype scripts

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check game JavaScript syntax
        run: node --check game.js
      - name: Check audio JavaScript syntax
        run: node --check audio.js
      - name: Check 3D freeze-build module syntax
        run: node --check --input-type=module < freeze.js
